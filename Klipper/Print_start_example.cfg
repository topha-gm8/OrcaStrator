### Beginning of your print_start gcode macro

  M117 Heating up the hotends
  #replace your tool heating section with the following
  {% for tool_nr in printer.toolchanger.tool_numbers %}
        
    {% set tool_idle_temp_param = 'T' ~ tool_nr|string ~ '_IDLE' %}
    
    {% set tn = 'T' ~ tool_nr|string %}
 
    {% if tool_idle_temp_param in params %}
      {% if tool_nr|int == params.TOOL|int %}
        RESPOND TYPE=echo MSG='{"Start Heating initial tool T" ~ params.TOOL ~ " Print temp: " ~ params.TOOL_TEMP}'
        M104 T{ params.TOOL } S{ params.TOOL_TEMP } 
      {% elif params.UNDERHEATED_TOOLS is defined %}
        # insert_missing_tool_preheat.py ran against this file -- trust its list. Empty-but-present still counts as "ran", just nothing flagged.
        # Only tools it couldn't give enough in-body lead time to get an early full-temp heat here; everyone else waits for their in-body preheat (Orca's automatic one or the processor's inserted one) instead of idling hot the whole print.
        {% if tool_nr|string in params.UNDERHEATED_TOOLS.split(',') %}
          RESPOND TYPE=echo MSG='{"Heating underheated tool T" ~ tool_nr ~ " Idle temp: " ~ params[tool_idle_temp_param]}'
          M104 T{tool_nr} S{params[tool_idle_temp_param]}
        {% endif %}
      {% else %}
        # UNDERHEATED_TOOLS absent -- processor never touched this file. Fall back to the old blanket idle-heat-every-used-tool behavior.
        RESPOND TYPE=echo MSG='{"Heating tool T" ~ tool_nr ~ " Idle temp: " ~ params[tool_idle_temp_param]}'
        M104 T{tool_nr} S{params[tool_idle_temp_param]}
      {% endif %}
    {% endif %}  
  {% endfor %}
  

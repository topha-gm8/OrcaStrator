# Standalone SVG drawing primitives, extracted from contomo's auto_purge macro and extra skills added such as text drawing
# https://github.com/Contomo/klipper-toolchanger-hard/tree/main/examples/misc-macros#auto_purge

[gcode_macro _SVG_TOOLS]
gcode:
    {% set _ = missing_context_please_import_with_context_or_define_printer() if not printer %}
    {%- set gbl  = printer.printer.__class__.__init__.__globals__ -%}
    {%- set math = gbl.importlib.import_module('math') -%}

    {%- macro canvas(w, h, content, pad=0.0, max_size=400, interactive=True) -%}
        # width, height negative to flip SVG
        {%- set s =
            '<div class="svg_click_open" ' ~
            ('title="Click to open" ' if interactive else '') ~
            'style="max-inline-size:' ~ max_size ~ 'px; ' ~
                'max-block-size:' ~ max_size ~ 'px; ' ~
                'inline-size:100%; cursor:zoom-in;">'
        -%}

        {%- set abs_w, abs_h = w|abs, h|abs -%}
        {%- set view_w, view_h = abs_w + (pad*2), abs_h + (pad*2) -%}
        {%- set s = s ~
            '<div style="' ~
                'inline-size:100%; ' ~
                'max-inline-size:' ~ max_size ~ 'px; ' ~
                'max-block-size:' ~ max_size ~ 'px; ' ~
                'aspect-ratio:' ~ view_w ~ '/' ~ view_h ~ ';' ~
            '">'
        -%}
        {%- set s = s ~
            '<svg xmlns="http://www.w3.org/2000/svg" ' ~
                'viewBox="' ~ -pad ~ ' ' ~ -pad ~ ' ' ~ view_w ~ ' ' ~ view_h ~ '" ' ~
                'preserveAspectRatio="xMidYMid meet" ' ~
                'style="display:block;inline-size:100%;block-size:100%;">'
        -%}
        {%- set flip_x, flip_y = w < 0, h < 0 -%}
        {%- if flip_x or flip_y -%}
            {%- set s = s ~ 
            '<g transform="' ~
                'translate(' ~ (abs_w if flip_x else 0) ~ ', ' ~ (abs_h if flip_y else 0) ~ ')' ~
                'scale('     ~ (-1   if flip_x else 1) ~ ', ' ~ (-1   if flip_y else 1) ~ ')">'
            -%}
        {%- endif -%}
        {%- set s = s ~ content -%}
        {%- set s = s ~ ('</g>' if flip_x or flip_y else '') -%}
        {%- set s = s ~ '</svg>' -%}
        {%- set s = s ~ (interactive_js(*vaargs, **kwargs) if interactive else '') -%}
        {%- set s = s ~ '</div></div>' -%}
        { s }
    {%- endmacro -%}

    {%- macro rectangle(x, y, w, h, stroke_color="var(--p-border, black)", stroke_width=1, fill="none") -%}
        # Draws a generic rectangle.
        { '<rect x="' ~ x|round(3) ~ '" y="' ~ y|round(3) ~ '" width="' ~ w|round(3) ~ '" height="' ~ h|round(3) ~
          '" fill="' ~ fill ~ '" stroke="' ~ stroke_color ~ '" stroke-width="' ~ stroke_width|round(3) ~
          '" vector-effect="non-scaling-stroke" />' }
    {%- endmacro -%}
    
    {%- macro draw_ticks(x, y, w, h, size=12, stroke_color='var(--p-text-color, grey)', stroke_width=1.0, angle=0.0, linecap='butt') -%}
        {%- set r        = angle * math.pi / 180.0 -%}
        {%- set u1x, u1y = math.cos(r), math.sin(r) -%}
        {%- set center_x, center_y  = x + w / 2.0, y + h / 2.0 -%}
        {%- set points = [
            (x, y),     (x, y + h),
            (x + w, y), (x + w, y + h)
        ] -%}
        {%- set segs = [] -%} # segs uwu
        {%- for px, py in points -%}
            {%- set vx, vy = center_x - px, center_y - py -%}
            {%- set s1 = 1 if (vx *  u1x + vy * u1y) >= 0 else -1 -%}
            {%- set s2 = 1 if (vx * -u1y + vy * u1x) >= 0 else -1 -%}
            {%- set _ = segs.append('M ' ~ px ~ ' ' ~ py ~ ' l ' ~ (s1 * size *  u1x) ~ ' ' ~ (s1 * size * u1y)) -%}
            {%- set _ = segs.append('M ' ~ px ~ ' ' ~ py ~ ' l ' ~ (s2 * size * -u1y) ~ ' ' ~ (s2 * size * u1x)) -%}
        {%- endfor -%}
        { '<path d="' ~ segs|join(' ') ~ '" fill="none" stroke="' ~ stroke_color ~
        '" stroke-width="' ~ stroke_width ~ '" stroke-linecap="' ~ linecap ~
        '" vector-effect="non-scaling-stroke" />' }
    {%- endmacro -%}

    {%- macro polygon(points, stroke_color='var(--p-text-color2, white)', stroke_width=1, fill_color=random_color(alpha=0.7)) -%}
        {%- set pts = points|map('join',',')|join(' ') -%}
        { '<polygon points="' ~ pts ~ '" stroke="' ~ stroke_color ~ '" fill="' ~ 
            fill_color ~ '" stroke-width="' ~ stroke_width ~ '" />' }
    {%- endmacro -%}

    {%- macro polyline(points, stroke_color=random_color(alpha=0.7), stroke_width=0.6, dash=None) -%}
        # A real stroked line -- unlike polygon()/rectangle(), this has no
        # fill, so it's the right primitive for anything that's
        # conceptually a LINE (a curve, a reference line, an axis) rather
        # than a filled shape. stroke_width is honored via
        # vector-effect="non-scaling-stroke" (same technique rectangle()
        # and draw_ticks() already use above) so it renders at its stated
        # width in actual on-screen pixels regardless of how much the
        # surrounding canvas()'s viewBox scales everything else -- a
        # plain stroke-width would instead scale WITH the rest of the
        # drawing, silently rendering thinner or thicker than requested
        # depending on the viewer's zoom/CSS size. dash=None (the
        # default) draws a solid line; otherwise a [dash_len, gap_len, ...]
        # list (same units as stroke_width) becomes the stroke's
        # stroke-dasharray -- e.g. [8, 5] for evenly spaced dashes,
        # [2, 4] for a dotted look. linecap is 'butt' when dashed (a
        # rounded cap on a short dash reads as a fat dot, not a dash) and
        # 'round' when solid.
        {%- set pts = points|map('join',',')|join(' ') -%} # join
        {%- set dash_attr = (' stroke-dasharray="' ~ dash|map('string')|join(',') ~ '"') if dash else '' -%}
        { '<polyline points="' ~ pts ~ '" stroke="' ~ stroke_color ~ 
            '" fill="none" stroke-width="' ~ stroke_width ~ 
            '" stroke-linecap="' ~ ('butt' if dash else 'round') ~ '" stroke-linejoin="round"' ~
            dash_attr ~ ' vector-effect="non-scaling-stroke" />' }
    {%- endmacro -%}

    {%- macro crosshair(x, y, stroke_color="var(--p-text-color, light-grey)" , size=4.0, stroke_width=1.0) -%}
        { polyline([[x-size,y],[x+size,y]], stroke_color, stroke_width) ~
          polyline([[x,y-size],[x,y+size]], stroke_color, stroke_width) }
    {%- endmacro -%}

    {%- macro text(x, y, s, color="var(--p-text-color2, white)", size=12, anchor="start", weight="normal", counter_flip_x=False, counter_flip_y=True) -%}
        # A short text label -- e.g. a reference line's own temperature
        # value. Sized in the SAME user-space units as everything else
        # on this canvas (mm-like "canvas units", same space x/y/points
        # already live in), same as crosshair()'s own `size` above --
        # deliberately NOT a fixed on-screen pixel size the way marker's
        # size_px is, since a label should grow/shrink WITH the graph
        # (a big multi-tool print's bigger canvas gets bigger, still-
        # legible labels; a small graph gets correspondingly small ones)
        # rather than staying some fixed screen size regardless of how
        # zoomed in/out the surrounding drawing is. No vector-effect
        # here for that same reason -- vector-effect="non-scaling-
        # stroke" (used elsewhere in this file) exists specifically to
        # make something IGNORE the canvas's own scale, the opposite of
        # what's wanted for a label. `s` is escaped since, unlike every
        # other macro here, its content isn't Python-generated markup
        # under this codebase's own control -- it's arbitrary text a
        # caller could in principle build from almost anything.
        #
        # counter_flip_x/y: canvas() always wraps its whole content in a
        # <g transform="... scale(+-1, +-1)"> to flip the coordinate
        # space (OrcaStrator_render.cfg always calls it with h negated,
        # so canvas y=0 sits at the bottom -- same flip orcastrator.py's
        # to_px() applies on the PC side). Point-based shapes (polygon/
        # polyline/path) don't care -- their coordinates were computed
        # for that flipped space and a mirrored point cloud is still the
        # same point cloud. Glyphs aren't symmetric under a flip though,
        # so without correction the ancestor <g>'s scale(1,-1) renders
        # every label upside-down/mirrored (PC side never hits this
        # since Tk's create_text takes already-flipped coordinates and
        # draws glyphs upright itself, rather than flipping a rendered
        # glyph). Fixed here by wrapping the glyph in its OWN local
        # transform that flips it back around its own anchor point
        # BEFORE the ancestor's flip is applied -- the two cancel out on
        # the glyph's orientation while leaving the anchor position (and
        # therefore every other shape's math) untouched. Defaults match
        # this file's one real call site (OrcaStrator_render.cfg: flip_y
        # always on, flip_x never); pass counter_flip_x/y=False here if
        # a future caller ever draws text on an unflipped canvas.
        {%- set sx = -1 if counter_flip_x else 1 -%}
        {%- set sy = -1 if counter_flip_y else 1 -%}
        {%- set xr, yr = x|round(3), y|round(3) -%}
        {%- set glyph_transform =
            (' transform="translate(' ~ xr ~ ',' ~ yr ~ ') scale(' ~ sx ~ ',' ~ sy ~ ') translate(' ~ (-x)|round(3) ~ ',' ~ (-y)|round(3) ~ ')"')
            if (counter_flip_x or counter_flip_y) else ''
        -%}
        { '<text x="' ~ xr ~ '" y="' ~ yr ~ '" fill="' ~ color ~
            '" font-size="' ~ size ~ '" text-anchor="' ~ anchor ~
            '" font-weight="' ~ weight ~ '" font-family="sans-serif" dominant-baseline="middle"' ~
            glyph_transform ~ '>' ~
            s|e ~ '</text>' }
    {%- endmacro -%}

    {%- macro hatch_pattern(id, color='var(--p-text-color2, grey)', angle=45, spacing=4, stroke_width=1.5) -%}
        { '<pattern id="' ~ id ~ '" patternUnits="userSpaceOnUse" width="' ~ spacing ~ '" height="' ~ spacing ~
          '" patternTransform="rotate(' ~ angle ~ ')">' ~
          '<line x1="0" y1="0" x2="0" y2="' ~ spacing ~ '" stroke="' ~ color ~
          '" stroke-width="' ~ stroke_width ~ '" />' ~
          '</pattern>' }
    {%- endmacro -%}

    {%- macro random_color(alpha=None, h_min=0, h_max=3600, s_min=550, s_max=850, v_min=700, v_max=950) -%}
        {%- set h = (range(h_min, h_max)|random) / 10.0 -%}
        {%- set s = (range(s_min, s_max + 1)|random) / 1000.0 -%}
        {%- set v = (range(v_min, v_max + 1)|random) / 1000.0 -%}
        {%- set r, g, b = hsv_to_rgb(h, s, v).split(',')|map('int') -%}
        {%- if alpha -%}
            { 'rgba(' ~ r ~ ',' ~ g ~ ',' ~ b ~ ',' ~ alpha ~ ')' }
        {%- else -%}
            { 'rgb(' ~ r ~ ',' ~ g ~ ',' ~ b ~ ')' }
        {%- endif -%}
    {%- endmacro -%}

    {%- macro hsv_to_rgb(h, s, v) -%}
        {%- set h = h % 360.0 -%}
        {%- set i = (h // 60)|int -%}
        {%- set f = (h / 60.0) - i -%}
        {%- set p = v * (1.0 - s) -%}
        {%- set q = v * (1.0 - s * f) -%}
        {%- set t = v * (1.0 - s * (1.0 - f)) -%}
        {%- set rgb_map = [
            [v, t, p],
            [q, v, p],
            [p, v, t],
            [p, q, v],
            [t, p, v],
            [v, p, q]
        ] -%}
        {%- set r = (rgb_map[i % 6][0] * 255)|round|int -%}
        {%- set g = (rgb_map[i % 6][1] * 255)|round|int -%}
        {%- set b = (rgb_map[i % 6][2] * 255)|round|int -%}
        { r ~ ',' ~ g ~ ',' ~ b }
    {%- endmacro -%}

    {%- macro interactive_js(label='svg_click_open', initial_zoom=None) -%}
        {%- set js %}{%- raw -%}
        (function(img){
        try{
            var box = img.closest('.{%- endraw -%}{label}{%- raw -%}');
            if (box==null){ img.remove(); return; }
            if (box.dataset && box.dataset.bound){ img.remove(); return; }
            box.dataset.bound='1';

            var theme = box.closest('.theme--dark') || document.body;

            function copyAllCustomProps(fromEl,toEl){
            try{
                var cs = getComputedStyle(fromEl);
                for (var i=0;i<cs.length;i++){
                var name = cs[i];
                if (name && name.indexOf('--')===0){
                    var v = cs.getPropertyValue(name);
                    if (v){ toEl.style.setProperty(name, v.trim()); }
                }
                }
            }catch(e){}
            }

            box.addEventListener('click', function(){
            try{
                var s = box.querySelector('svg'); if (s==null) return;

                var vb = s.viewBox && s.viewBox.baseVal ? s.viewBox.baseVal : null;
                var vw0 = vb ? vb.width  : 1000;
                var vh0 = vb ? vb.height : 1000;

                var clone = s.cloneNode(true);
                clone.removeAttribute('style');
                clone.setAttribute('style','display:block;width:100%;height:100%');

                var panel = document.createElement('div');
                panel.setAttribute('style',
                    'position:absolute;left:0;top:0;' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'transform-origin:0 0;cursor:auto;'
                );
                copyAllCustomProps(theme, panel);
                panel.appendChild(clone);

                var ov = document.createElement('div');
                ov.setAttribute('style',
                    'position:fixed;left:0;top:0;right:0;bottom:0;' +
                    'background:transparent;overflow:hidden;' +
                    'z-index:99999;cursor:zoom-out;'
                );
                copyAllCustomProps(theme, ov);

                function fitScale(){
                    var w = window.innerWidth, h = window.innerHeight;
                    var k = Math.min(w*0.95/vw0, h*0.95/vh0);
                    if (!(k>0)) k = 1;
                    return k;
                }
                var initialZoom = parseFloat(box.dataset.initialZoom);
                var k = (initialZoom > 0) ? initialZoom : fitScale();

                var tx = Math.floor((window.innerWidth  - vw0*k)/2);
                var ty = Math.floor((window.innerHeight - vh0*k)/2);

                function apply(){
                    panel.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + k + ')';
                    panel.style.width  = vw0 + 'px';
                    panel.style.height = vh0 + 'px';
                }
                apply();

                var dragging=false, lastX=0, lastY=0;

                panel.addEventListener('mousedown', function(ev){
                try{
                    if (ev.button===0){
                    dragging=true; lastX=ev.clientX; lastY=ev.clientY;
                    panel.style.cursor='grabbing'; ev.preventDefault();
                    }
                }catch(e){}
                });

                window.addEventListener('mouseup', function(){
                try{
                    if (dragging){ dragging=false; panel.style.cursor='auto'; }
                }catch(e){}
                });

                window.addEventListener('mousemove', function(ev){
                try{
                    if (!dragging) return;
                    var dx = ev.clientX - lastX, dy = ev.clientY - lastY;
                    lastX = ev.clientX; lastY = ev.clientY;
                    tx += dx; ty += dy; apply();
                }catch(e){}
                });

                clone.addEventListener('wheel', function(ev){
                try{
                    ev.preventDefault();
                    var rect = panel.getBoundingClientRect();
                    var mx = ev.clientX, my = ev.clientY;
                    var u = (mx - rect.left)/k;
                    var v = (my - rect.top)/k;
                    var step = ev.ctrlKey ? 0.15 : 0.08;
                    var factor = ev.deltaY > 0 ? (1+step) : (1-step);
                    if (!(factor>0)) factor = 1;
                    var k2 = k * factor;
                    var tx2 = Math.round(mx - u*k2);
                    var ty2 = Math.round(my - v*k2);
                    k = Math.max(k2, 0.01);
                    tx = tx2; ty = ty2;
                    apply();
                }catch(e){}
                }, {passive:false});

                function onResize(){
                try{
                    var mx = window.innerWidth/2, my = window.innerHeight/2;
                    var rect = panel.getBoundingClientRect();
                    var u = (mx - rect.left)/k;
                    var v = (my - rect.top)/k;
                    var k2 = fitScale();
                    var tx2 = Math.round(mx - u*k2);
                    var ty2 = Math.round(my - v*k2);
                    k = k2; tx = tx2; ty = ty2; apply();
                }catch(e){}
                }

                function onKey(e){ if (e && e.key==='Escape') close(); }

                function close(){
                    window.removeEventListener('resize', onResize);
                    document.removeEventListener('keydown', onKey);
                    if (ov.parentNode) ov.parentNode.removeChild(ov);
                }

                ov.addEventListener('click', function(){ close(); });
                panel.addEventListener('click', function(e){ e.stopPropagation(); });

                window.addEventListener('resize', onResize);
                document.addEventListener('keydown', onKey);

                ov.appendChild(panel);
                theme.appendChild(ov);
            }catch(e){}
            });
        }catch(e){} finally{ img.remove(); }
        })(this)
        {%- endraw -%}{%- endset -%}
        { '<img src=x style="display:none" onerror="' ~ js|replace('\n', '') ~ '">' }
    {%- endmacro -%}



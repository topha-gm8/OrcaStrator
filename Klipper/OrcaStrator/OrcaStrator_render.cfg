# ============================================================================
# ORCASTRATOR_RENDER
# ----------------------------------------------------------------------------
# Companion to the OrcaSlicer post-processing pipeline (orcastrator.py
# + post_processors/, run on your PC at export time). This macro does NOT
# run any Python subprocess, does NOT parse or rasterize the toolpath, and
# does NOT import numpy/scipy -- all of that already happened at export
# time. It just reads a small header off the front of the file (bounded
# read, default 64KB) and renders whatever was embedded there.
#
# THIS MACRO HAS NO DOCK-CHECK-SPECIFIC KNOWLEDGE. It reacts to two
# generic things any processor in post_processors/ can emit via stdout,
# which orcastrator embeds into the ORCASTRATOR_LOG block:
#
#   SVG_PAYLOAD:{...}   -- rendered as its own console message, one per
#                          payload found (zero, one, or many).
#   NOTICE:{"level": "info"|"warning"|"abort", "title": "...", "message": "...", "display": true|false}
#                       -- "info"/"warning" are shown on the console
#                          UNLESS "display" is explicitly false (missing
#                          "display" defaults to true, same as an older
#                          NOTICE with no such key at all -- backward
#                          compatible with every processor that predates
#                          this key). This is a console-visibility
#                          preference only, set per-processor via that
#                          processor's own "notice": {"display": ...}
#                          config -- see post_processors/helpers/notice.py.
#                          The notice is ALWAYS embedded in the file
#                          regardless of this flag; nothing about
#                          whether/how a processor ran is ever lost, only
#                          whether THIS macro chooses to print it here.
#                          "abort" means "refuse to print this file" --
#                          ANY processor can trigger that, not just a
#                          dock check, and "display" is NEVER consulted
#                          for it -- an abort notice always shows, full
#                          stop, no matter what a processor's own
#                          "notice" config says (see below). If there
#                          are multiple abort notices they're all
#                          combined into one final error so none of them
#                          get silently dropped.
#
# Adding a processor that wants to show a visualization or block a print
# for its own reasons needs ZERO changes to this file.
#
#
# WIRING IT UP
# ------------
#[include OrcaStrator/OrcaStrator_render.cfg] #Add to printer.cfg rename as required
#
#
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: _SDCARD_PRINT_FILE
gcode:
  {% set vsd_root = printer.configfile.settings.virtual_sdcard.path %}
  {% set sep      = '/' if not vsd_root.endswith('/') else '' %}
  {% set fullpath = vsd_root ~ sep ~ (params.FILENAME or '') %}
  ORCASTRATOR_RENDER PATH="{fullpath}"
  _SDCARD_PRINT_FILE {rawparams}
#
#
# SAFETY MODEL
# ------------
# require_processed defaults to True: if NO ORCASTRATOR_LOG block is
# found at all, this macro raises an error and refuses to continue --
# "unprocessed file" is treated as "unsafe file" categorically, since we
# have no idea what ran or didn't. This is the ONLY thing checked
# generically for "did postprocessing happen at all"; everything else
# (dock collisions, or whatever future processor needs to block a print)
# goes through the NOTICE abort mechanism instead.
#
# Message ordering matters: action_raise_error aborts the rest of this
# macro immediately, so SVGs / info / warning notices are all emitted
# BEFORE any abort notice, guaranteeing they're still visible even when
# the file ultimately gets rejected.
# ============================================================================

[gcode_macro ORCASTRATOR_RENDER]
description: "Render any embedded SVG payloads and NOTICEs (info/warning/abort) from a g-code file"
variable_settings: {
        'read_window_bytes': 65536,
        'log_scan_max_bytes': 16777216,
        'require_processed': True
    }
gcode:
    {% set SELF = 'ORCASTRATOR_RENDER' %}

    {% set gbl      = printer.printer.__class__.__init__.__globals__ %}
    {% set imp_mod  = gbl.importlib.import_module %}
    {% set bi       = imp_mod('builtins') %}
    {% set os       = imp_mod('os') %}
    {% set json_mod = imp_mod('json') %}
    {% set pp       = printer.printer %}

    {%- set LOG_START = '; ORCASTRATOR_LOG_START' -%}
    {%- set LOG_END   = '; ORCASTRATOR_LOG_END' -%}
    {%- set SVG_PFX   = '; SVG_PAYLOAD:' -%}
    {%- set NOTICE_PFX = '; NOTICE:' -%}

    {%- macro msg(s, is_error=False) -%}
        {%- set prefix_color = "--v-error-base, red"      if is_error else "--v-accent-base" -%}
        {%- set text_color   = "--v-warning-base, orange" if is_error else "--p-text-color2" -%}
        {%- set action       = action_raise_error         if is_error else action_respond_info -%}
        {%- set prefix_html  = "<span style=\"color: var(" ~ prefix_color ~ "); font-weight:bold;\">" ~ SELF ~ " </span>" -%}
        {%- set msg_html     = "<span style=\"color: var(" ~ text_color ~ ");\">" ~ s ~ "</span>" -%}
        { action(prefix_html ~ msg_html) -}
    {%- endmacro -%}

    {%- macro normpath(p='') -%} { os.path.abspath(os.path.expanduser(p)) } {%- endmacro -%}

    {%- macro resolve_gcode_file(path='') -%}
        {%- if not (path.startswith('/') or path.startswith('~')) -%}
            {%- set base = printer.configfile.settings.virtual_sdcard.path or '' -%}
            {%- set name = path or printer.print_stats.filename -%}
            {%- set path = (base ~ ('/' if not base.endswith('/') else '') ~ name) if (base and name) else '' -%}
        {%- endif -%}
        { normpath(path) }
    {%- endmacro -%}

    #-------------------- block extraction --------------------------------
    {%- macro extract_segment(data, start_marker, end_marker) -%}
        {%- set start = data.find(start_marker) -%}
        {%- set end   = data.find(end_marker, start + start_marker|length) if start != -1 else -1 -%}
        {%- if start != -1 and end != -1 -%}
            { data[start:end] }
        {%- endif -%}
    {%- endmacro -%}

    #-------------------- postprocessing log (SVG/NOTICE lines excluded) ----
    {%- macro build_log_html(log_segment) -%}
        {%- set raw_lines = log_segment.splitlines() if log_segment else [] -%}
        {%- set rows = [] -%}
        {%- for ln in raw_lines -%}
            {%- set stripped = ln.strip().lstrip(';').strip() -%}
            {%- set skip = (not stripped) or ('ORCASTRATOR_LOG' in stripped)
                or stripped.startswith('SVG_PAYLOAD:') or stripped.startswith('NOTICE:') -%}
            {%- set _ = rows.append(stripped) if not skip else None -%}
        {%- endfor -%}
        {%- if rows -%}
            {%- set block_style = "margin-top:8px; padding:5px 10px; border-radius:4px; font-size:0.75em; border:1px solid var(--p-border); background:var(--p-background-darker);" -%}
            { '<details style="margin-top:6px;"><summary style="cursor:pointer;">Postprocessing log</summary><div style="' ~ block_style ~ '">' ~ rows|join('<br/>') ~ '</div></details>' }
        {%- endif -%}
    {%- endmacro -%}

    #-------------------- SVG rendering (one plain message per payload) -----
    {%- macro render_svg_envelope(envelope) -%}
        {% set payload = envelope.payload %}
        {% set _svg_tools = pp.lookup_object('gcode_macro _SVG_TOOLS', None) %}
        {% if not _svg_tools %}
            { msg("Cannot render SVG_PAYLOAD from '" ~ envelope.source ~ "': _SVG_TOOLS macro not found.") }
        {% else %}
            {% import _svg_tools.template.template as svg with context %}
            {% set canvas_cfg = payload.get('canvas', dict()) %}
            {% set w        = (canvas_cfg.get('x_max', 200))|float %}
            {% set h        = (canvas_cfg.get('y_max', 200))|float %}
            {% set pad      = (canvas_cfg.get('pad', 5.0))|float %}
            {% set max_size = (canvas_cfg.get('max_size', 260))|float %}

            {% set parts = [] %}
            {% set defs  = [] %}
            {% macro _add(p) %}{% set _ = parts.append(p) %}{% endmacro %}
            {% macro _def(p) %}{% set _ = defs.append(p) %}{% endmacro %}

            { _add( svg.rectangle(0, 0, w, h, stroke_color="var(--p-border)", stroke_width=0.5, fill="var(--p-background-darker)") ) }
            { _add( svg.draw_ticks(0, 0, w, h, size=10, stroke_color='var(--p-text-color, grey)', stroke_width=1.0) ) }

            {% for shape in payload.get('shapes', []) %}
                {% if shape.type == 'polygon' %}
                    {% set fill_ref = shape.fill %}
                    {% if shape.get('fill_style') == 'hatch' %}
                        {% set pid = 'hatch_' ~ loop.index %}
                        { _def( svg.hatch_pattern(id=pid, color=shape.stroke, angle=shape.get('hatch_angle', 45), spacing=shape.get('hatch_spacing', 4)) ) }
                        {% set fill_ref = 'url(' ~ bi.chr(35) ~ pid ~ ')' %}
                    {% endif %}
                    # Producers that set stroke == fill (e.g.
                    # toolchange_heatmap's base band, isolated-toolchange
                    # lines, and gradient strip segments) aren't asking for
                    # a visible border -- they're just filling in both
                    # fields because the payload shape requires one. A
                    # flat stroke_width=1.0 here would still draw a
                    # same-color outline on top of the fill, silently
                    # inflating precisely-sized shapes (like the heatmap's
                    # configured line_width_px) past their intended pixel
                    # width -- same issue as the Tk-side renderer in
                    # orcastrator.py, fixed the same way. Shapes that DO
                    # want a distinct border (dock_collision_guard's
                    # silhouettes, zone highlights, etc.) set a stroke that
                    # differs from fill and keep their outline as before.
                    {% set stroke_w = 0.0 if shape.stroke == shape.fill else 1.0 %}
                    { _add( svg.polygon(points=shape.points, stroke_color=shape.stroke, fill_color=fill_ref, stroke_width=stroke_w) ) }
                {% elif shape.type == 'path' %}
                    # A real stroked line (see svg_tools.cfg's polyline()
                    # docstring) -- width_px/dash render exactly as
                    # requested regardless of this canvas's own scale,
                    # unlike a 'polygon' faking a line via a filled ribbon
                    # shape would.
                    { _add( svg.polyline(points=shape.points, stroke_color=shape.get('color', 'var(--p-text-color2, white)'), stroke_width=shape.get('width_px', 1.0), dash=shape.get('dash')) ) }
                {% elif shape.type == 'crosshair' %}
                    { _add( svg.crosshair(shape.x, shape.y, stroke_color=shape.get('color', 'yellow'), size=shape.get('size', 4.0), stroke_width=1.2) ) }
                {% elif shape.type == 'text' %}
                    { _add( svg.text(shape.x, shape.y, shape.get('text', ''), color=shape.get('color', 'var(--p-text-color2, white)'), size=shape.get('size', 12), anchor=shape.get('anchor', 'start'), weight=shape.get('weight', 'normal')) ) }
                {% endif %}
            {% endfor %}

            {% set defs_block = ('<defs>' ~ defs|join ~ '</defs>') if defs else '' %}
            {% set title = payload.title or ('SVG from ' ~ envelope.source) %}
            { msg("<b>" ~ title ~ "</b><br/>" ~ svg.canvas(w=w, h=(-1.0 * h), content=defs_block ~ parts|join, pad=pad, max_size=max_size)) }
        {% endif %}
    {%- endmacro -%}

    #-------------------- main -------------------------------------------------
    {%- macro main() -%}
        {% set target = resolve_gcode_file(params.PATH or params.FILE or params.TARGET or '') %}

        {% if not target or not os.path.exists(target) %}
            { msg("Target file does not exist: " ~ target, is_error=True) }
        {% else %}
            {% set fh   = bi.open(target, 'r', encoding='utf-8', errors='ignore') %}
            {% set data = fh.read(settings.read_window_bytes) %}

            {% set fname = target.split('/')|last %}
            {% set start_found = data.find(LOG_START) != -1 %}

            #---- LOG_START opened within the first window but LOG_END never
            #     showed up in it -- the block itself (e.g. a data-heavy
            #     SVG_PAYLOAD like the tool temperature graph) just ran long.
            #     Keep widening the read, doubling each time, until LOG_END
            #     turns up or we hit the hard cap -- rather than assuming
            #     "unprocessed" just because one fixed-size window missed it.
            #     NOTE: log_segment lives on the namespace, not as a bare
            #     {% set %} -- a plain {% set %} inside the {% for %} below
            #     would only be visible for that single loop iteration and
            #     never propagate back out, silently discarding a match.
            {% set ns = namespace(data=data, window=settings.read_window_bytes,
                                   segment=extract_segment(data, LOG_START, LOG_END)) %}
            {% if start_found and not ns.segment %}
                {% for _ in range(32) if not ns.segment and ns.window < settings.log_scan_max_bytes %}
                    {% set ns.window = [ns.window * 2, settings.log_scan_max_bytes] | min %}
                    {% set _ = fh.seek(0) %}
                    {% set ns.data = fh.read(ns.window) %}
                    {% set ns.segment = extract_segment(ns.data, LOG_START, LOG_END) %}
                {% endfor %}
            {% endif %}
            {% set _ = fh.close() %}
            {% set log_segment = ns.segment %}

            {% if not log_segment %}
                {% if start_found %}
                    { msg("Found the start of the postprocessing header in <code>" ~ fname
                        ~ "</code> but never its closing marker, even after scanning "
                        ~ ns.window ~ " bytes. The log block looks truncated or corrupt "
                        ~ "-- refusing to print. Re-slice with the post-processing script "
                        ~ "enabled.", is_error=True) }
                {% elif settings.require_processed %}
                    { msg("No postprocessing header found in the first "
                        ~ settings.read_window_bytes ~ " bytes of <code>" ~ fname
                        ~ "</code>. This file wasn't run through the OrcaSlicer "
                        ~ "post-processing pipeline -- refusing to print. Re-slice "
                        ~ "with the post-processing script enabled.", is_error=True) }
                {% else %}
                    { msg("No postprocessing header found -- continuing anyway "
                        ~ "(require_processed is False).") }
                {% endif %}
            {% else %}
                #---- gather everything generically: any processor, any count
                {% set svg_envelopes = [] %}
                {% set notices = [] %}
                {% for ln in log_segment.splitlines() %}
                    {% set svg_idx = ln.find(SVG_PFX) %}
                    {% if svg_idx != -1 %}
                        {% set _ = svg_envelopes.append(json_mod.loads(ln[svg_idx + SVG_PFX|length:].strip())) %}
                    {% endif %}
                    {% set notice_idx = ln.find(NOTICE_PFX) %}
                    {% if notice_idx != -1 %}
                        {% set _ = notices.append(json_mod.loads(ln[notice_idx + NOTICE_PFX|length:].strip())) %}
                    {% endif %}
                {% endfor %}
                {% set log_html = build_log_html(log_segment) %}

                #---- emit non-fatal content first: SVGs, then info/warning notices, then the log
                {% for envelope in svg_envelopes %}
                    { render_svg_envelope(envelope) }
                {% endfor %}

                {% for entry in notices if entry.notice.level in ['info', 'warning']
                    and entry.notice.get('display', True) %}
                    { msg("<b>" ~ entry.notice.title ~ "</b><br/>" ~ entry.notice.message) }
                {% endfor %}

                {% if log_html %}
                    { msg(log_html) }
                {% endif %}

                #---- abort notices last: combine all of them into one final error.
                #---- deliberately does NOT filter on "display" -- see this file's
                #---- own header comment on the NOTICE convention.
                {% set abort_entries = [] %}
                {% for entry in notices %}
                    {% set _ = abort_entries.append(entry) if entry.notice.level == 'abort' else None %}
                {% endfor %}
                {% if abort_entries %}
                    {% set combined = [] %}
                    {% for entry in abort_entries %}
                        {% set _ = combined.append("<b>" ~ entry.notice.title ~ "</b> (" ~ entry.source ~ "): " ~ entry.notice.message) %}
                    {% endfor %}
                    { msg("Refusing to print <code>" ~ fname ~ "</code>:<br/>" ~ combined|join('<br/>'), is_error=True) }
                {% endif %}
            {% endif %}
        {% endif %}
    {%- endmacro -%}

    { main() }
